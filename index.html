<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Finanças da Casa</title>
  <meta name="description" content="Controle financeiro familiar - contribuições e contas da casa" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0B1F4D" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finanças" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="loading-screen">
    <svg class="loading-house" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 6L58 26V56H6V26L32 6Z" fill="#1E5EFF"/>
      <rect x="16" y="30" width="32" height="26" fill="white"/>
      <rect x="27" y="40" width="10" height="16" fill="#1E5EFF"/>
    </svg>
    <div>Carregando Finanças da Casa...</div>
  </div>

  <div id="root"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch((err) => {
          console.warn("Falha ao registrar service worker:", err);
        });
      });
    }
  </script>
</body>
</html>
